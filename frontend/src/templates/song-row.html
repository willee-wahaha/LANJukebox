<div class="track-row">
    <button class="track-play" data-add-song="{{ID}}" aria-label="Add to queue">{{TRACK}}</button>
    <button class="track-title" data-add-song="{{ID}}">
        <strong>{{TITLE}}</strong>
        <small>{{ARTIST}}</small>
    </button>
    <span class="track-artist">{{ARTIST}}</span>
    <span class="track-duration">{{DURATION}}</span>
    <button class="add-track" data-play-song="{{ID}}" aria-label="Play">▶</button>
</div>

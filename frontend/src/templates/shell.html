<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">♫</span><span>Music Remote</span></div>
    <nav class="nav">
      <button class="nav-item {{HOME_ACTIVE}}" data-nav="home">⌂ <span data-i18n="nav.library">音樂庫</span></button>
      <button class="nav-item {{SEARCH_ACTIVE}}" data-nav="search">⌕ <span data-i18n="nav.search">搜尋</span></button>
      <button class="nav-item {{QUEUE_ACTIVE}}" data-action="toggle-queue">☷ <span data-i18n="nav.queue">播放佇列</span></button>
    </nav>
    <div class="language-picker"><label for="language-select" data-i18n="language.label">語言</label><select id="language-select" aria-label="Language"><option value="zh-TW">繁體中文</option><option value="en-US">English</option></select></div>
  </aside>
  <main class="main-area">
    <header class="topbar"><div class="topbar-title" data-i18n="header.{{TITLE_KEY}}">{{TITLE}}</div><div class="topbar-actions"><span class="connection"><i></i> <span data-i18n="header.server">本機音樂伺服器</span></span></div></header>
    <section id="content" class="content"></section>
  </main>
  {{QUEUE_PANEL}}
  {{PLAYER_BAR}}
</div>
<div id="toast" class="toast" role="status"></div>

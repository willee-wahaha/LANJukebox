<footer class="player-bar">
    <div class="now-playing">
        <img class="now-cover" src="{{COVER}}" alt="">
        <div class="now-meta">
            <strong>{{SONG_TITLE}}</strong>
            <small>{{SONG_ARTIST}}</small>
        </div>
    </div>
    <div class="player-center">
        <div class="player-controls">
            <button class="player-control mode-button {{SHUFFLE_SELECTED}}" data-action="toggle-shuffle" aria-label="Shuffle" title="Shuffle">⤨</button>
            <button class="player-control subtle" data-action="previous" aria-label="Previous">|◀</button>
            <button class="player-control play-button" data-action="{{PLAY_ACTION}}" aria-label="Play/Pause">{{PLAY_ICON}}</button>
            <button class="player-control subtle" data-action="next" aria-label="Next">▶|</button>
            <button class="player-control mode-button {{REPEAT_SELECTED}}" data-action="cycle-repeat" aria-label="Repeat" title="Repeat">{{REPEAT_ICON}}</button>
        </div>
        <div class="progress-row">
            <span id="current-time">
                {{POSITION}}
            </span>
            <div class="progress-track" data-action="seek-track">
                <div class="progress-fill" style="width:{{PROGRESS}}%"></div>
            </div>
            <span id="total-time">{{DURATION}}</span>
        </div>
    </div>
    <div class="player-right">
        <button class="icon-button {{QUEUE_SELECTED}}" data-action="toggle-queue" aria-label="Queue">☷</button>
        <label class="device-picker" title="Audio output">
            <span aria-hidden="true">▣</span>
            <select data-control="device" aria-label="Audio output">
                {{DEVICE_OPTIONS}}
            </select>
        </label>
        <span class="volume-symbol">◖</span>
        <input class="volume-slider" type="range" min="0" max="100" value="{{VOLUME}}" data-control="volume" aria-label="Volume" title="Volume">
    </div>
</footer>

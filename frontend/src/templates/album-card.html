<button class="album-card" data-open-album="{{ID}}">
    <div class="cover-wrap">
        <img src="{{COVER}}" alt="{{ALT}}" loading="lazy">
        <span class="cover-play">▶</span>
    </div>
    <strong>{{NAME}}</strong>
    <small>{{ARTIST}} · {{SONG_COUNT}} 
        <span data-i18n="common.songs">首</span>
    </small>
</button>
